<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" dir="rtl" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="500" height="300" fill="#f8fafc" rx="12"/>
  
  <!-- כותרת -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0a1e2e">מגמות סייבר 2023-2026</text>
  
  <!-- ציר X -->
  <line x1="60" y1="240" x2="480" y2="240" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- שנים -->
  <text x="130" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748b">2023</text>
  <text x="230" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748b">2024</text>
  <text x="330" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748b">2025</text>
  <text x="430" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748b" font-weight="bold">2026</text>

  <!-- עלות פרצה (כחול) -->
  <rect x="100" y="140" width="20" height="100" fill="#005f8a" rx="3"/>
  <rect x="200" y="110" width="20" height="130" fill="#005f8a" rx="3"/>
  <rect x="300" y="85" width="20" height="155" fill="#005f8a" rx="3"/>
  <rect x="400" y="55" width="20" height="185" fill="#0a1e2e" rx="3"/>
  
  <!-- כופרה (אדום) -->
  <rect x="122" y="190" width="20" height="50" fill="#e74c3c" rx="3"/>
  <rect x="222" y="165" width="20" height="75" fill="#e74c3c" rx="3"/>
  <rect x="322" y="130" width="20" height="110" fill="#e74c3c" rx="3"/>
  <rect x="422" y="90" width="20" height="150" fill="#c0392b" rx="3"/>

  <!-- מקרא -->
  <rect x="70" y="275" width="12" height="12" fill="#005f8a" rx="2"/>
  <text x="88" y="285" font-family="Arial,sans-serif" font-size="11" fill="#0a1e2e">עלות פרצת נתונים</text>
  <rect x="220" y="275" width="12" height="12" fill="#e74c3c" rx="2"/>
  <text x="238" y="285" font-family="Arial,sans-serif" font-size="11" fill="#0a1e2e">מתקפות כופרה</text>
  
  <!-- ערכים -->
  <text x="110" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#005f8a">$4.45M</text>
  <text x="210" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#005f8a">$4.88M</text>
  <text x="310" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#005f8a">$5.17M</text>
  <text x="410" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#0a1e2e" font-weight="bold">$5.49M</text>
</svg>
